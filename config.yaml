# Single configuration file for thresholds, windows, bands and paths.
# Every numeric value marked PLACEHOLDER is listed in TUNING.md and must be
# validated on real data before it is trusted.

capture:
  nominal_rows_per_s: 100          # PLACEHOLDER
  min_rows_per_s: 50               # PLACEHOLDER: session marked unusable below this
  gap_threshold_s: 0.05            # gaps over 50 ms are counted (from plan FR4)
  timestamp_bits: 32               # ESP32 microsecond counter width (wraps ~71.6 min)
  rotate_minutes: 60

preprocess:
  resample_hz: 20                  # PLACEHOLDER: breathing needs << 20 Hz
  breath_band_hz: [0.1, 0.7]       # PLACEHOLDER: 6 to 42 breaths per minute
  heart_band_hz: [0.8, 2.0]        # PLACEHOLDER: experimental
  butter_order: 4
  pca_components: 1
  n_subcarriers_keep: 20           # PLACEHOLDER: top-variance subcarriers

breath:
  window_s: 60                     # PLACEHOLDER
  step_s: 30                       # PLACEHOLDER
  min_pnr_db: 3.0                  # PLACEHOLDER: peak-to-noise floor for a valid estimate
  max_estimator_disagreement_bpm: 3.0   # PLACEHOLDER
  motion_z: 4.0                    # PLACEHOLDER: robust z of window variance => motion
  presence_rel_var: 0.1            # PLACEHOLDER: window var / session median var below this => absent (scale-free)

night:
  min_valid_hours: 3.0             # PLACEHOLDER: below this the night is not valid
  min_quality: 0.5                 # PLACEHOLDER

baseline:
  window_days: 28                  # PLACEHOLDER
  warmup_nights: 5                 # PLACEHOLDER: maturity = warm-up below this
  mature_nights: 14                # PLACEHOLDER: maturity = mature at/above this
  alert_robust_z: 2.5              # PLACEHOLDER: |x - median| / (1.4826*MAD)
  mad_floor:                       # PLACEHOLDER: min MAD used in robust z (small-n MAD underestimates spread)
    rr_med: 0.3                    # bpm
    rr_var: 0.05
    presence_hours: 0.2            # h
    restless_frac: 0.01

safety:
  severe_symptom_codes: [chest_pain_sudden, fainting, severe_breathlessness]

retention:
  raw_days: 14

# Pluggable estimator cores, as "module:function". The defaults are the
# reference implementations in csi_core. To use your own scripts, put them in
# plugins/ (a package inside this repo, so no absolute paths are needed) and
# point here, e.g. breath: "plugins.my_breath:estimate". The function signature
# is documented in docs/interfaces.md (Estimator plug-ins).
estimators:
  breath: "csi_core.breath:reference_core"
  heart: "csi_core.heart:reference_core"
  motion: "csi_core.motion:reference_core"

auth:
  # Login throttling: in-process fixed windows, no Redis. Counts FAILED logins only.
  # When a window's count reaches its max, further logins for that key get 429 +
  # Retry-After until the window ends. A successful login clears the (email, ip) count only.
  login_window_s: 900               # PLACEHOLDER: window length, seconds
  max_failures_per_email_ip: 5      # PLACEHOLDER: per (email, client IP)
  max_failures_per_email: 20        # PLACEHOLDER: per email, across all IPs

# Experimental short-session score (on-demand Monitor sessions; INTEGRATION_PLAN.md D2).
# Ranges are the operator-supplied reference ranges from waiwai1/engine/SLEEP_SCORER_INTEGRATION.md.
# A reading inside [low, high] gets full credit. Outside, credit falls linearly with the distance
# beyond the edge, measured as a fraction of the range width; it reaches 0 at falloff_low /
# falloff_high. Low and high are tracked and tuned separately. Not a clinical measure.
session_scoring:
  respiration_bpm:
    low: 12.0                      # PLACEHOLDER (operator reference range)
    high: 23.0                     # PLACEHOLDER
    falloff_low: 0.25              # PLACEHOLDER: credit 0 at 25% of range width below low
    falloff_high: 0.25             # PLACEHOLDER
  heart_rate_bpm:
    low: 65.0                      # PLACEHOLDER (operator reference range)
    high: 90.0                     # PLACEHOLDER
    falloff_low: 0.25              # PLACEHOLDER
    falloff_high: 0.25             # PLACEHOLDER
  weights:                         # PLACEHOLDER: must sum to 1
    respiration: 0.40
    heart_rate: 0.40
    motion: 0.20
  motion:
    mad_multiplier: 0.85           # PLACEHOLDER: rolling robust threshold multiplier
    floor_m_s2: 0.02               # PLACEHOLDER: minimum acceleration threshold
    jerk_threshold_m_s3: null      # unset until the operator supplies one
